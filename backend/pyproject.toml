[project]
name = "stock-predictor-api"
version = "0.2.0"
description = "Educational market data and technical analysis API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: hits the live upstream data provider (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]  # tests may inspect private cache internals
