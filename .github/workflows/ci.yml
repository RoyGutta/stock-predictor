name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same branch — the older result is not useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported and current, so we catch both floors and ceilings.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Test
        working-directory: backend
        # Tests stub the data provider, so this never touches the network.
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check no .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. It must never be committed."
            exit 1
          fi
          echo "No .env tracked."

      - name: Check personal.md stays untracked
        run: |
          if git ls-files --error-unmatch personal.md 2>/dev/null; then
            echo "::error::personal.md is tracked. It holds local setup notes and keys."
            exit 1
          fi
          echo "personal.md is not tracked."

      - name: Check no node_modules is tracked
        run: |
          count=$(git ls-files | grep -c node_modules || true)
          if [ "$count" -ne 0 ]; then
            echo "::error::$count node_modules paths are tracked."
            exit 1
          fi
          echo "No node_modules tracked."
